<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remain — Christian Kuria · Aurora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/styles/aurora.css" />
</head>
<body>
  <!-- Nền video (tùy chọn) + trường Aurora + khí quyển -->
  <video id="bgvideo" class="bgvideo" muted loop playsinline autoplay preload="auto"></video>
  <div class="aurora"><div class="au au-a"></div><div class="au au-b"></div></div>
  <div class="scrim"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <div class="chrome">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="timecode" id="timecode">0:00 / 0:00</div>
  </div>

  <main class="stage" id="stage"><div class="flow" id="flow"></div></main>

  <audio id="audio" src="assets/audio/clip.mp3" preload="auto"></audio>

  <div class="controls" id="controls">
    <div class="title"><b>Remain</b> — Christian Kuria</div>
    <button id="playBtn">▶ Play</button>
    <button id="fsBtn">⛶ Fullscreen</button>
    <div class="status" id="status">Loading…</div>
  </div>

  <script src="src/vendor/gsap.min.js"></script>
  <script>window.gsap || document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"><\/script>');</script>

  <script src="src/js/lrc-parser.js"></script>
  <script src="src/js/sections.js"></script>
  <script src="src/js/aurora-bg.js"></script>
  <script src="src/js/word-timings.js"></script>
  <script src="src/js/clock.js"></script>
  <script src="src/js/animations.js"></script>
  <script src="src/js/emphasis.js"></script>
  <script src="src/js/lyrics.data.js"></script>
  <script src="src/js/words.data.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
