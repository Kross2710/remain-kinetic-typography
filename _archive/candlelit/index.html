<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remain — Kinetic Typography</title>

  <!-- Font serif "tâm tình" (cần internet; offline sẽ tự fallback về serif hệ thống) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <!-- Các lớp nền: quầng sáng trôi chậm + vignette + grain -->
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <!-- Sân khấu lyrics -->
  <main class="stage" id="stage"></main>

  <!-- Audio: thả file của bạn vào assets/audio/clip.mp3, hoặc dùng nút "Chọn nhạc…" -->
  <audio id="audio" src="assets/audio/clip.mp3" preload="auto"></audio>

  <!-- Điều khiển -->
  <div class="controls">
    <div class="title"><b>Remain</b> — Christian Kuria</div>
    <button id="playBtn">▶ Phát</button>
    <button id="previewBtn">✨ Xem thử (không nhạc)</button>
    <label class="filelabel" for="fileInput">🎵 Chọn nhạc…</label>
    <input type="file" id="fileInput" accept="audio/*" />
    <div class="status" id="status">Đang tải…</div>
  </div>

  <!-- GSAP core (local; tự fallback CDN nếu thiếu file) -->
  <script src="src/vendor/gsap.min.js"></script>
  <script>
    window.gsap || document.write(
      '<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"><\/script>'
    );
  </script>

  <!-- Module logic — thứ tự nạp quan trọng -->
  <script src="src/js/lrc-parser.js"></script>
  <script src="src/js/word-timings.js"></script>
  <script src="src/js/clock.js"></script>
  <script src="src/js/animations.js"></script>
  <script src="src/js/lyrics.data.js"></script>
  <script src="src/js/words.data.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
